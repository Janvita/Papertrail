[project]
name = "papertrail"
version = "0.1.0"
description = "A research copilot agent that reads, critiques, compares, and traces the evolution of scientific papers"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=0.2",
    "litellm>=1.40",
    "docling>=2.0",
    "arxiv>=2.1",
    "httpx>=0.27",
    "PyGithub>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project]
name = "papertrail"
version = "0.1.0"
description = "Builds a literature survey for a research topic: ranked papers, reading order, summaries and a citation graph"
requires-python = ">=3.11"
dependencies = ["openai>=3.57.0", "requests>=2.34.2", "pyvis>=0.3.2", "python-dotenv>=1.2.4", "pyyaml>=6.0.4"]

[tool.pdm]
distribution = false   # a script project, not an installable package: pdm only manages dependencies

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

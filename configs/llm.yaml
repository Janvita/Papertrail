# LLM providers and which model each job uses.
# Change models here. API keys stay in .env (the env var named by key_env).

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    json_mode: true
  openai:
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    json_mode: true
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_env: GEMINI_API_KEY
    json_mode: true
  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    json_mode: true
  anthropic:
    base_url: https://api.anthropic.com/v1/
    key_env: ANTHROPIC_API_KEY
    json_mode: false   # no response_format support
  ollama:
    base_url: http://localhost:11434/v1
    key_env: null
    json_mode: true

roles:
  main:      # per-paper summaries and extraction
    provider: groq
    model: openai/gpt-oss-120b
  filter:    # relevance scoring of candidate papers
    provider: groq
    model: qwen/qwen3.8-27b
  topic:     # topic -> search queries
    provider: groq
    model: openai/gpt-oss-20b
